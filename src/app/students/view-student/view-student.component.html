<div class="page-header">
  <div class="container">
    <h1>Öğrencileri Görüntüle</h1>
  </div>
</div>

<div class="container">

  <!-- Geri Dön butonu -->
  <div class="row p-1">
    <div class="col-xs-12 right">
      <a [routerLink]="['/students']"
         mat-raised-button
         color="primary"
         class="back-btn">
        <mat-icon>chevron_left</mat-icon>
        Geri Dön
      </a>
    </div>
  </div>

  <!-- Sayfa içeriği -->
  <div class="row">

    <!-- SOL: Form -->
    <div class="col-xs-12 col-md-6">
      <form #studentDetailsForm="ngForm">

        <div class="row">
          <div class="col-xs-12 col-md-6">
            <mat-form-field appearance="outline">
              <mat-label>Ad</mat-label>
              <input matInput placeholder="Ad">
            </mat-form-field>
          </div>

          <div class="col-xs-12 col-md-6">
            <mat-form-field appearance="outline">
              <mat-label>Soyad</mat-label>
              <input matInput placeholder="Soyad">
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-xs-12">
            <mat-form-field appearance="outline">
              <mat-label>Doğum Tarihi</mat-label>
              <input matInput [matDatepicker]="picker">
              <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-xs-12 col-md-6">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput placeholder="Email">
            </mat-form-field>
          </div>

          <div class="col-xs-12 col-md-6">
            <mat-form-field appearance="outline">
              <mat-label>Telefon</mat-label>
              <input matInput placeholder="Telefon">
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <div class="col-xs-12">
            <mat-form-field appearance="outline">
              <mat-label>Cinsiyet</mat-label>
              <input matInput placeholder="Cinsiyet">
            </mat-form-field>
          </div>
        </div>

        <!-- Adres -->
        <div class="row">
          <div class="col-xs-12">
            <mat-form-field appearance="outline">
              <mat-label>Adres</mat-label>
              <textarea matInput rows="3" placeholder="Adres"></textarea>
            </mat-form-field>
          </div>
        </div>

        <!-- Posta Kodu -->
        <div class="row">
          <div class="col-xs-12">
            <mat-form-field appearance="outline">
              <mat-label>Posta Kodu</mat-label>
              <input matInput placeholder="Posta Kodu">
            </mat-form-field>
          </div>
        </div>

      </form>
    </div>

 

  </div>
</div>
